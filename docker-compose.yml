# ── Container logs capped (CLAUDEWORK-4): json-file logs otherwise grow without bound in /var/lib/docker ──
x-logging: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  # ── Redis Cache ───────────────────────────────────────────────────────────────
  redis:
    logging: *logs
    # mycache's own image = Redis + Python (dockerspace/Dockerfile) — built once, then offline
    build:
      context: .
      dockerfile: dockerspace/Dockerfile
      args:
        REDIS_VERSION: ${REDIS_VERSION}
    image: mycache-redis:${REDIS_VERSION}
    container_name: mycache-redis
    restart: unless-stopped        # kms sealed at start → it stops, then retries by itself
    # The cache-agent is the entry point — Redis's assistant: it gets the password from kms
    # (agent.conf REDIS_PASSWORD = its kms address, the agent's own login), writes it to RAM
    # (/run/redis.conf, /mycache-secrets for the UI), starts redis-server as its child and
    # serves its API on :8892. Never on a command line, never on disk.
    command: ["/opt/venv/bin/python", "/cache-agent/supervisor.py"]
    tmpfs:
      - /run
    ports:
      - "${REDIS_HOST}:${REDIS_PORT}:6379"
      - "8892:8892"
    env_file: .env                 # Redis settings (no secret — those are kms addresses in cache-agent/agent.conf)
    environment:
      LOG_MIRROR_ROOT: /mountspace/logs/myworkspace/projectspace/mycache
      PYTHONUNBUFFERED: "1"          # the agent's output reaches docker logs at once
      PYTHONDONTWRITEBYTECODE: "1"   # no root-owned __pycache__ in the mounted cache-agent/ folder
    volumes:
      - mycache-redis:/data
      - ./cache-agent:/cache-agent                        # the agent + its kms login (connect_external/kms/credentials/)
      - mycache-secrets:/mycache-secrets                  # RAM: the password for the Redis UI
      - ../../mountspace/logs:/mountspace/logs
    networks:
      mycache-net:
      my_docker_network:
        ipv4_address: 172.28.0.50      # static IP within my_docker_network's subnet
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /run/redis.conf)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Commander (web UI) ──────────────────────────────────────────────────
  redis-commander:
    logging: *logs
    image: rediscommander/redis-commander:latest
    container_name: mycache-redis-ui
    # the password comes from the Redis container (RAM volume), into env only — never argv
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - sh
      - -c
      - REDIS_HOSTS="local:mycache-redis:6379:0:$$(cat /mycache-secrets/redis_password)" exec /redis-commander/docker/entrypoint.sh
    volumes:
      - mycache-secrets:/mycache-secrets:ro
    ports:
      - "8081:8081"
    networks:
      mycache-net:
      my_docker_network:
        ipv4_address: 172.28.0.51      # static IP within my_docker_network's subnet
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mycache-redis:
  mycache-secrets:                 # RAM only (tmpfs): never written to disk
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,mode=0750"

networks:
  mycache-net:
    driver: bridge
  # Shared network created by myworkspace/dockerspace/docker_network.sh (via docker_up).
  my_docker_network:
    external: true
