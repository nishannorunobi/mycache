services:

  # ── Redis Cache ───────────────────────────────────────────────────────────────
  redis:
    image: redis:${REDIS_VERSION}
    container_name: mycache-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_HOST}:${REDIS_PORT}:6379"
      - "8892:8892"
    environment:
      LOG_MIRROR_ROOT: /mountspace/logs/myworkspace/projectspace/mycache
    volumes:
      - mycache-redis:/data
      - ./cache-agent:/cache-agent
      - ../../mountspace/logs:/mountspace/logs
    networks:
      mycache-net:
      my_docker_network:
        ipv4_address: 172.28.0.50      # static IP within my_docker_network's subnet
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Commander (web UI) ──────────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mycache-redis-ui
    environment:
      REDIS_HOSTS: local:mycache-redis:6379:0:${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      mycache-net:
      my_docker_network:
        ipv4_address: 172.28.0.51      # static IP within my_docker_network's subnet
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mycache-redis:

networks:
  mycache-net:
    driver: bridge
  # Shared network created by myworkspace/dockerspace/docker_network.sh (via docker_up).
  my_docker_network:
    external: true
